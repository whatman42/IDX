name: God Entity Autonomous Evolution

on:
  schedule:
    - cron: '0 0,12 * * *' 
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve-and-adapt:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Available Capabilities
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: 4. Configure Git for God Entity
        run: |
          git config --global user.name "God Entity Agent"
          git config --global user.email "god-entity@autonomous.ai"

      - name: 5. Execute Boot Test (Pre-flight Check)
        run: python self_evolving_agent.py --test-boot

      - name: 6. Run Autonomous Evolution Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_MODE: commit
          GOD_MAX_ITERATIONS: 5
          GOD_TIMEOUT: 600
        run: |
          python self_evolving_agent.py --run

      - name: 7. Push Evolved Changes
        run: |
          git push origin main || echo "Tidak ada perubahan baru untuk di-push."
