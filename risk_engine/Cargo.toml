[package]
name = "risk_engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic risk guardrails for IDX quant system"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
