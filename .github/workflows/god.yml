name: GOD ENTITY CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:      # trigger manual

env:
  GIT_MODE: disabled
  GOD_TIMEOUT: 300
  GOD_MAX_ITERATIONS: 5

jobs:
  test-agent:
    runs-on: ubuntu-latest

    steps:
      # =========================================================================
      # 1. CHECKOUT REPOSITORY
      # actions/checkout commit SHA (v4.2.2)
      # =========================================================================
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # 2. PYTHON
      # actions/setup-python@v5.6.0
      # =========================================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      # =========================================================================
      # 3. CACHE DEPENDENCIES
      # actions/cache@v4.2.4
      # =========================================================================
      - name: Cache Pip Dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # =========================================================================
      # 4. INSTALL DEPENDENCIES
      # =========================================================================
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================================================================
      # 5. RUN AGENT SELF-TEST
      # =========================================================================
      - name: Run Boot and Self-Test
        id: boot-test
        run: |
          python self_evolving_agent.py --test-boot

      # =========================================================================
      # 6. OBSERVE ENVIRONMENT
      # =========================================================================
      - name: Run Environment Observation
        if: always()
        run: |
          python self_evolving_agent.py --observe

      # =========================================================================
      # 7. SHOW STATUS
      # =========================================================================
      - name: Show Agent Status
        if: always()
        run: |
          python self_evolving_agent.py --status

      # =========================================================================
      # 8. UPLOAD LOGS ON FAILURE
      # =========================================================================
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: god-entity-logs
          path: .god_entity_logs/
          retention-days: 7
