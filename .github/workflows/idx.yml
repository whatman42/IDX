# ==============================================================================
# GitHub Actions Workflow: IDX Stock Analysis Engine & Signal Pipeline
# File: .github/workflows/idx_analysis_pipeline.yml
# Compliance: Indonesia Stock Exchange (IDX) Quantitative Pipeline (v2026)
# ==============================================================================
name: IDX Stock Analysis & Signal Generator Workflow

on:
  # 1. Jadwal Otomatis (Cron Job) - Sesuai Jam Kerja Bursa Efek Indonesia (IDX)
  # Senin - Jumat, Pukul 08:30 WIB (01:30 UTC) dan 16:15 WIB (09:15 UTC)
  schedule:
    - cron: '30 1 * * 1-5'
    - cron: '15 9 * * 1-5'

  # 2. Eksekusi Manual dari GitHub Actions Tab
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Pilih Mode Eksekusi Pipeline"
        required: true
        default: 'dry_run'
        type: choice
        options:
          - dry_run
          - self_learning
          - health_check
          - reset

# Mencegah Race Condition pada SQLite DB & Git Repository State
concurrency:
  group: idx-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: "Asia/Jakarta"
  PYTHONUNBUFFERED: "1"
  CI: "true"

jobs:
  run-idx-pipeline:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------------
      # 1. Checkout Repository
      # ------------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # 2. Setup Python Environment
      # ------------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ------------------------------------------------------------------------
      # 3. Cache Local Parquet & Market Data Engine
      # ------------------------------------------------------------------------
      - name: Restore Local Data Cache
        uses: actions/cache@v4
        with:
          path: .cache/
          key: idx-data-cache-${{ runner.os }}-${{ hashFiles('universe.json') }}
          restore-keys: |
            idx-data-cache-${{ runner.os }}-

      # ------------------------------------------------------------------------
      # 4. Install Dependencies
      # ------------------------------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ------------------------------------------------------------------------
      # 5. Prepare Output Directories & Git Keep Files
      # ------------------------------------------------------------------------
      - name: Prepare Directories & Placeholders
        run: |
          mkdir -p \
            .cache/corporate_actions \
            reports \
            logs \
            data \
            storage \
            models
          touch \
            reports/.gitkeep \
            logs/.gitkeep \
            data/.gitkeep \
            storage/.gitkeep \
            models/.gitkeep \
            .cache/.gitkeep

      # ------------------------------------------------------------------------
      # 6. Run IDX Analysis Pipeline
      # ------------------------------------------------------------------------
      - name: Run IDX Stock Analysis Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IDX_PROXY_URL: ${{ secrets.IDX_PROXY_URL }}
          IDX_FETCH_TIMEOUT_SEC: "25.0"
        run: |
          # Ambil input manual, jika kosong (berjalan via Cron) default ke 'dry_run'
          MODE="${{ github.event.inputs.run_mode }}"
          if [ -z "$MODE" ]; then
            MODE="dry_run"
          fi

          echo "🚀 Running Pipeline in Mode: $MODE"

          if [ "$MODE" = "reset" ]; then
            echo "🔄 RESET SIMULATION CAPITAL & PORTFOLIO STATE"
            python main.py --reset-dryrun
          elif [ "$MODE" = "self_learning" ]; then
            echo "🧠 SELF LEARNING MODEL RETRAINING"
            python main.py --self-learning-update
          elif [ "$MODE" = "health_check" ]; then
            echo "🩺 SYSTEM HEALTH & NETWORK EGRESS CHECK"
            python monitoring.py
          else
            echo "🧪 DRY RUN & SIGNAL GENERATION PIPELINE"
            python main.py --dry-run
          fi

      # ------------------------------------------------------------------------
      # 7. Commit & Push Updated Persistent States & Models (FIXED & ALIGNED)
      # ------------------------------------------------------------------------
      - name: Commit & Push Updated Files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Tarik remote changes SEBELUM melakukan staging/add
          git fetch origin main
          git rebase origin/main || {
            echo "⚠️ Rebase conflict detected, resetting rebase state..."
            git rebase --abort || true
            git pull origin main --rebase || true
          }

          # 2. Cek & Jamin keberadaan universe.json (Pencarian di subfolder atau buat Fallback)
          if [ ! -f "universe.json" ]; then
            if [ -f "data/universe.json" ]; then
              echo "📋 Moving data/universe.json to root..."
              cp data/universe.json ./universe.json
            elif [ -f ".cache/universe.json" ]; then
              echo "📋 Moving .cache/universe.json to root..."
              cp .cache/universe.json ./universe.json
            else
              echo "⚙️ Creating default universe.json state..."
              python -c "
import json
with open('universe.json', 'w') as f:
    json.dump({'status': 'active', 'auto_generated': True}, f, indent=2)
"
            fi
          fi

          # 3. Force Stage universe.json agar lepas dari rintangan .gitignore
          git add -f universe.json 2>/dev/null || true
          git add portfolio_*.json checkpoint*.json 2>/dev/null || true
          git add data/ reports/ logs/ storage/ models/ 2>/dev/null || true
          
          # 4. Stage seluruh database SQLite (*.db, *.sqlite)
          find . \( -name "*.db" -o -name "*.sqlite" \) -print0 | xargs -0 -r git add

          # 5. Mencegah commit kosong jika tidak ada perubahan state
          if git diff --cached --quiet; then
            echo "✔ tidak ada perubahan state/database untuk di-commit."
            exit 0
          fi
          
          # 6. Commit dan Push perubahan
          git commit -m "chrono(bot): auto-update IDX signals, SQLite db, models, and portfolio state [skip ci]"
          git push origin HEAD

      # ------------------------------------------------------------------------
      # 8. Upload Diagnostics on Failure
      # ------------------------------------------------------------------------
      - name: Upload Telemetry Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: idx-execution-failure-logs
          retention-days: 14
          path: |
            *.log
            *.json
            logs/
            reports/
