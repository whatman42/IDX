# ==============================================================================
# GitHub Actions Workflow: GOD ENTITY
# File: .github/workflows/idx.yml
# Version: v2026.Q3.GOD-ENTITY
#
# PURPOSE:
#   Autonomous IDX analysis + self-evolving agent.
#
# EXECUTION:
#   IDX trading = SIMULATION ONLY
#   Live broker = DISABLED
#
# GOD ENTITY:
#   - filesystem read/write
#   - source modification
#   - self modification
#   - subprocess execution
#   - network research
#   - local Git operations
#   - autonomous generation lifecycle
#   - persistent memory
#
# AUTHENTICATION:
#   - No GH_TOKEN
#   - No TKO_PAT
#   - No personal GitHub PAT
#   - No gh auth login
#   - GitHub Actions GITHUB_TOKEN is used only by workflow infrastructure
#
# ==============================================================================

name: X

on:

  # ============================================================================
  # AUTOMATIC SCHEDULE
  # ============================================================================

  schedule:

    # HEALTH CHECK
    # 08:00 WIB = 01:00 UTC
    - cron: '0 1 * * 1-5'

    # SESSION I
    # 09:00–12:00 WIB
    - cron: '*/15 2-4 * * 1-5'
    - cron: '0 5 * * 1-5'

    # SESSION II
    # 13:30–15:45 WIB
    - cron: '30,45 6 * * 1-5'
    - cron: '*/15 7-8 * * 1-5'

    # POST-MARKET / SELF LEARNING
    # 16:15 WIB
    - cron: '15 9 * * 1-5'

  # ============================================================================
  # MANUAL EXECUTION
  # ============================================================================

  workflow_dispatch:

    inputs:

      run_mode:
        description: "Pilih mode eksekusi pipeline"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - self_learning
          - health_check
          - god_entity
          - reset


# ==============================================================================
# GLOBAL CONCURRENCY
# ==============================================================================

concurrency:
  group: idx-production-global-lock
  cancel-in-progress: false


# ==============================================================================
# WORKFLOW PERMISSIONS
#
# GITHUB_TOKEN hanya digunakan oleh Actions untuk repository operation.
# Tidak diekspos sebagai GH_TOKEN kepada Python agent.
# ==============================================================================

permissions:
  contents: write


# ==============================================================================
# GLOBAL ENVIRONMENT
# ==============================================================================

env:

  TZ: "Asia/Jakarta"

  PYTHONUNBUFFERED: "1"

  CI: "true"

  IDX_MAX_STALENESS_SEC: "86400.0"

  # --------------------------------------------------------------------------
  # HARD TRADING DOMAIN STATE
  # --------------------------------------------------------------------------

  IDX_SIMULATION_ONLY: "true"

  LIVE_BROKER_ENABLED: "false"

  # --------------------------------------------------------------------------
  # GOD ENTITY RUNTIME
  # --------------------------------------------------------------------------

  GOD_ENTITY: "true"

  GOD_ENTITY_AUTONOMOUS: "true"

  GOD_ENTITY_SELF_MODIFY: "true"

  GOD_ENTITY_GIT: "true"

  GOD_ENTITY_DRY_RUN: "false"


# ==============================================================================
# JOB
# ==============================================================================

jobs:

  run-idx-pipeline:

    name: GOD ENTITY

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      # ========================================================================
      # 1. CHECKOUT
      # ========================================================================

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================================
      # 2. PYTHON
      # ========================================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"


      # ========================================================================
      # 3. MARKET DATA CACHE
      # ========================================================================

      - name: Restore Persistent Market Data Cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .cache/
          key: idx-market-cache-${{ runner.os }}-py3.11-${{ github.run_id }}
          restore-keys: |
            idx-market-cache-${{ runner.os }}-py3.11-
            idx-market-cache-${{ runner.os }}-


      # ========================================================================
      # 4. DEPENDENCIES
      # ========================================================================

      - name: Install Dependencies & Tools
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install \
              polars \
              numpy \
              pandas \
              yfinance \
              requests \
              scipy \
              scikit-learn \
              joblib
          fi

          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y sqlite3
          fi


      # ========================================================================
      # 5. ACTION PINNING AUDIT
      # ========================================================================

      - name: Verify GitHub Actions SHA Pinning
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking GitHub Actions references..."

          if grep -RInE \
            'uses:[[:space:]]+[^@]+@(v[0-9]+|main|master|latest)' \
            .github/workflows; then

            echo "ERROR: Unpinned GitHub Action detected."
            exit 1
          fi

          echo "All GitHub Actions references are SHA pinned."


      # ========================================================================
      # 6. PYTHON COMPILATION
      # ========================================================================

      - name: Python Syntax & Compilation Gate
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m compileall -q .

          echo "Python compilation PASS."


      # ========================================================================
      # 7. REPOSITORY DISCOVERY
      # ========================================================================

      - name: Repository Discovery
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "GOD ENTITY REPOSITORY DISCOVERY"
          echo "=============================================="

          echo "PWD:"
          pwd

          echo
          echo "Git:"
          git status --short --branch

          echo
          echo "Repository:"
          git remote -v || true

          echo
          echo "Python files:"
          find . \
            -type f \
            -name "*.py" \
            -not -path "./.git/*" \
            | sort

          echo
          echo "Repository discovery complete."


      # ========================================================================
      # 8. RUNTIME DIRECTORIES
      # ========================================================================

      - name: Prepare Runtime Directories
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p \
            .cache \
            .cache/corporate_actions \
            reports \
            logs \
            data \
            storage \
            models \
            agent_runtime

          touch \
            .cache/.gitkeep \
            reports/.gitkeep \
            logs/.gitkeep \
            data/.gitkeep \
            storage/.gitkeep \
            models/.gitkeep \
            agent_runtime/.gitkeep

          if [ ! -f prediksi_idx_log.csv ]; then
            echo \
              "timestamp,ticker,prediction_probability,prediction_confidence,signal_status" \
              > prediksi_idx_log.csv
          fi


      # ========================================================================
      # 9. UNIVERSE BOOTSTRAP
      # ========================================================================

      - name: Bootstrap Universe
        env:
          IDX_PROXY_URL: ${{ secrets.IDX_PROXY_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -f universe.json ]; then

            echo "universe.json not found."

            if python main.py --help 2>&1 \
              | grep -q -- "--bootstrap-universe"; then

              python main.py --bootstrap-universe

            else

              echo "Bootstrap CLI unavailable."
              echo "Continuing."

            fi

          fi

          if [ -f universe.json ]; then
            echo "Universe available."
          else
            echo "WARNING: universe.json unavailable."
          fi


      # ========================================================================
      # 10. DETERMINE MODE
      # ========================================================================

      - name: Determine Execution Mode
        id: mode
        shell: bash
        run: |
          set -Eeuo pipefail

          MODE="${{ github.event.inputs.run_mode }}"

          if [ "${{ github.event_name }}" = "schedule" ]; then

            TRIGGER_CRON="${{ github.event.schedule }}"

            if [ "$TRIGGER_CRON" = "0 1 * * 1-5" ]; then

              MODE="health_check"

            elif [ "$TRIGGER_CRON" = "15 9 * * 1-5" ]; then

              MODE="self_learning"

            else

              MODE="dry_run"

            fi

          fi

          if [ -z "$MODE" ]; then
            MODE="dry_run"
          fi

          case "$MODE" in

            dry_run)
              ;;

            self_learning)
              ;;

            health_check)
              ;;

            god_entity)
              ;;

            reset)
              ;;

            *)
              echo "ERROR: Invalid mode: $MODE"
              exit 1
              ;;

          esac

          echo "Selected mode: $MODE"

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"


      # ========================================================================
      # 11. IDX PIPELINE
      # ========================================================================

      - name: Run IDX Pipeline
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          IDX_PROXY_URL: ${{ secrets.IDX_PROXY_URL }}

          IDX_FETCH_TIMEOUT_SEC: "15.0"

          IDX_SIMULATION_ONLY: "true"

          LIVE_BROKER_ENABLED: "false"

        shell: bash
        run: |
          set -Eeuo pipefail

          MODE="${{ steps.mode.outputs.mode }}"

          echo "=============================================="
          echo "IDX PIPELINE"
          echo "MODE: $MODE"
          echo "SIMULATION ONLY: $IDX_SIMULATION_ONLY"
          echo "LIVE BROKER: $LIVE_BROKER_ENABLED"
          echo "=============================================="

          case "$MODE" in

            reset)

              python main.py --reset-dryrun

              ;;

            self_learning)

              python main.py --self-learning --enable-self-evolving

              ;;

            health_check)

              if python main.py --help 2>&1 \
                | grep -q -- "--health-check"; then

                python main.py --health-check

              elif [ -f monitoring.py ]; then

                python monitoring.py

              else

                echo "Health-check entry point unavailable."
                exit 1

              fi

              ;;

            god_entity)

              echo "GOD ENTITY MODE"

              python main.py --dry-run --enable-self-evolving

              ;;

            dry_run|*)

              python main.py --dry-run --enable-self-evolving

              ;;

          esac


      # ========================================================================
      # 12. GOD ENTITY (sea.py Direct Standalone Execution)
      #
      # Execution target disinkronkan ke sea.py (sebelumnya self_evolving_agent.py).
      # ========================================================================

      - name: Run GOD Entity (sea.py)
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          IDX_PROXY_URL: ${{ secrets.IDX_PROXY_URL }}

          IDX_SIMULATION_ONLY: "true"

          LIVE_BROKER_ENABLED: "false"

          GOD_ENTITY: "true"

          GOD_ENTITY_AUTONOMOUS: "true"

          GOD_ENTITY_SELF_MODIFY: "true"

          GOD_ENTITY_GIT: "true"

          GOD_ENTITY_DRY_RUN: "false"

          GIT_MODE: "disabled"

          GOD_MAX_ITERATIONS: "5"

          GOD_TIMEOUT: "300"

        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "GOD ENTITY (sea.py)"
          echo "=============================================="

          echo "Autonomous: $GOD_ENTITY_AUTONOMOUS"
          echo "Self Modify: $GOD_ENTITY_SELF_MODIFY"
          echo "Git: $GOD_ENTITY_GIT"
          echo "Dry Run: $GOD_ENTITY_DRY_RUN"
          echo "Simulation Only: $IDX_SIMULATION_ONLY"
          echo "Live Broker: $LIVE_BROKER_ENABLED"

          echo
          echo "Git status before evolution:"
          git status --short --branch

          echo
          echo "Starting evolutionary engine..."

          if [ -f sea.py ]; then

            python sea.py --run

          else

            echo "ERROR: sea.py tidak ditemukan."
            exit 1

          fi

          echo
          echo "GOD ENTITY process completed."


      # ========================================================================
      # 13. POST-EVOLUTION COMPILATION
      # ========================================================================

      - name: Post Evolution Compilation
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "POST-EVOLUTION ANALYSIS"
          echo "=============================================="

          python -m compileall -q . || {
            echo "WARNING: Repository contains Python compilation errors."
            exit 1
          }

          echo "Post-evolution compilation PASS."


      # ========================================================================
      # 14. SIMULATION SAFETY STATE
      # ========================================================================

      - name: Verify Trading Execution State
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import os

          simulation = os.environ.get(
              "IDX_SIMULATION_ONLY",
              ""
          ).lower()

          broker = os.environ.get(
              "LIVE_BROKER_ENABLED",
              ""
          ).lower()

          if simulation != "true":
              raise SystemExit(
                  "FAIL: IDX_SIMULATION_ONLY != true"
              )

          if broker != "false":
              raise SystemExit(
                  "FAIL: LIVE_BROKER_ENABLED != false"
              )

          print("Trading domain state PASS.")
          print("IDX_SIMULATION_ONLY =", simulation)
          print("LIVE_BROKER_ENABLED =", broker)
          PY


      # ========================================================================
      # 15. SQLITE INTEGRITY
      # ========================================================================

      - name: SQLite Checkpoint & Integrity Audit
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          DB_FOUND=0

          while IFS= read -r -d '' db_file; do

            DB_FOUND=1

            echo "Processing: $db_file"

            sqlite3 "$db_file" \
              "PRAGMA wal_checkpoint(TRUNCATE);" \
              || true

            CHECK_RESULT="$(
              sqlite3 "$db_file" \
              "PRAGMA integrity_check;"
            )"

            if [ "$CHECK_RESULT" != "ok" ]; then

              echo "ERROR: SQLite integrity failure."
              echo "Database: $db_file"
              echo "Result: $CHECK_RESULT"

              exit 1

            fi

            echo "SQLite PASS: $db_file"

          done < <(
            find . \
              -type f \
              \( \
                -name "*.db" \
                -o -name "*.sqlite" \
              \) \
              -print0
          )

          if [ "$DB_FOUND" -eq 0 ]; then
            echo "No SQLite database generated."
          fi


      # ========================================================================
      # 16. EVOLUTION STATE
      # ========================================================================

      - name: Evolution State Summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "GOD ENTITY STATE"
          echo "=============================================="

          echo
          echo "Git:"
          git status --short --branch

          echo
          echo "Recent commits:"
          git log --oneline -10 || true

          echo
          echo "Memory:"
          find . \
            -maxdepth 2 \
            -type f \
            \( \
              -name "*.db" \
              -o -name "*.sqlite" \
            \) \
            -print || true

          echo
          echo "Generational/runtime files:"
          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*generation*" \
              -o -name "*evolution*" \
              -o -name "*checkpoint*" \
              -o -name "portfolio*.json" \
            \) \
            -print || true

          echo
          echo "Reports:"
          find reports \
            -maxdepth 2 \
            -type f \
            -print 2>/dev/null || true

          echo
          echo "Logs:"
          find logs \
            -maxdepth 2 \
            -type f \
            -print 2>/dev/null || true


      # ========================================================================
      # 17. COMMIT EVOLUTION / RUNTIME STATE
      # ========================================================================

      - name: Persist Evolution & Runtime State
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking evolutionary changes..."

          git status --short

          git add -A

          if git diff --cached --quiet; then

            echo "No changes generated by GOD Entity."

            exit 0

          fi

          git commit \
            -m "god(entity): autonomous evolution and runtime state [skip ci]"

          echo "Evolution committed."

          git fetch origin main

          MAX_PUSH_ATTEMPTS=3
          PUSH_ATTEMPT=1

          while true; do

            if git push origin HEAD:main; then

              echo "Evolution pushed successfully."

              break

            fi

            if [ "$PUSH_ATTEMPT" -ge "$MAX_PUSH_ATTEMPTS" ]; then

              echo "Push failed after $MAX_PUSH_ATTEMPTS attempts."

              exit 1

            fi

            echo "Push rejected."

            git fetch origin main

            if ! git rebase origin/main; then

              echo "Rebase failed."

              git rebase --abort || true

              exit 1

            fi

            PUSH_ATTEMPT=$((PUSH_ATTEMPT + 1))

            sleep 3

          done


      # ========================================================================
      # 18. FAILURE TELEMETRY
      # ========================================================================

      - name: Upload Telemetry Logs on Failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: god-entity-failure-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            logs/**/*.log
            logs/*.log
            reports/**/*.md
            reports/*.md
            reports/**/*.csv
            prediksi_idx_log.csv
            portfolio_*.json
            portfolio_state.json
            .god_entity_memory.db
            sea.py.bak
            "*.db"
            "*.sqlite"
