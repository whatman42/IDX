[package]
name = "risk_engine"
version = "0.2.0"
edition = "2021"
description = "Deterministic risk guardrails for IDX quant system"
rust-version = "1.70"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "risk_engine"
path = "src/main.rs"
