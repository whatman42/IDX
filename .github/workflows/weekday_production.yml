# IDX Weekday EOD Production — Mon–Fri after market close
# Local: 16:30 Asia/Jakarta | UTC cron: 30 9 * * 1-5 (WIB = UTC+7, no DST)
# NO cold-start training. APPROVED models only.

name: Weekday Production

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "paper"
        type: choice
        options: [paper, dry-run]

concurrency:
  group: idx-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IDX_STATE_AUTHORITY: ${{ secrets.IDX_STATE_AUTHORITY || 'auto' }}
      MODE: ${{ github.event.inputs.mode || 'paper' }}
      IDX_SCHEDULE_TYPE: WEEKDAY_PRODUCTION
      IDX_RISK_BINARY: ${{ github.workspace }}/risk_engine/target/release/risk_engine

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: risk_engine
      - name: Build risk engine
        working-directory: risk_engine
        run: cargo build --release
      - name: Production cycle (approved models only)
        run: python -m src.python.pipeline.run_cycle --mode "$MODE"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekday-diagnostics
          path: |
            state/
            models/
          if-no-files-found: ignore
