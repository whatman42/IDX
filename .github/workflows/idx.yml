# ==============================================================================
# GitHub Actions Workflow: IDX Stock Analysis Engine
# File: .github/workflows/idx_analysis_pipeline.yml
# Version: v2026.Q3.v28.1
# Scope: Analysis + RULE_BASED/ML signal + simulated portfolio
# LIVE BROKER: DISABLED
# Policy: all actions pinned to full-length commit SHA
# ==============================================================================

name: IDX Stock Analysis Engine

on:
  # --------------------------------------------------------------------------
  # AUTOMATIC SCHEDULE
  # --------------------------------------------------------------------------
  schedule:
    # HEALTH CHECK — 08:00 WIB / 01:00 UTC
    - cron: "0 1 * * 1-5"

    # SESSION I — 09:00–12:00 WIB
    - cron: "*/15 2-4 * * 1-5"

    # SESSION II — 13:30–15:45 WIB
    - cron: "30,45 6 * * 1-5"
    - cron: "*/15 7 * * 1-5"
    - cron: "*/15 8 * * 1-5"

    # POST MARKET — 16:15 WIB / 09:15 UTC
    - cron: "15 9 * * 1-5"

  # --------------------------------------------------------------------------
  # MANUAL RUN
  # --------------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Pilih mode eksekusi"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - health_check
          - self_learning
          - release_audit
          - reset

      confirm_simulation:
        description: "Konfirmasi bahwa eksekusi tetap simulation-only"
        required: true
        default: true
        type: boolean

# Prevent concurrent mutation of portfolio/state/database.
concurrency:
  group: idx-production-global-lock
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: "Asia/Jakarta"
  PYTHONUNBUFFERED: "1"
  CI: "true"
  IDX_MAX_STALENESS_SEC: "86400.0"

jobs:

  # ============================================================================
  # MAIN PIPELINE
  # ============================================================================
  run-idx-pipeline:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ------------------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # 2. PYTHON
      # ------------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      # ------------------------------------------------------------------------
      # 3. CACHE
      # ------------------------------------------------------------------------
      - name: Restore Market Data Cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: .cache/
          key: idx-cache-${{ runner.os }}-py311-${{ github.run_id }}
          restore-keys: |
            idx-cache-${{ runner.os }}-py311-
            idx-cache-${{ runner.os }}-

      # ------------------------------------------------------------------------
      # 4. DEPENDENCIES
      # ------------------------------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install polars numpy pandas yfinance joblib scipy scikit-learn lightgbm
          fi

      # ------------------------------------------------------------------------
      # 5. SAFETY GUARD — simulation only
      # ------------------------------------------------------------------------
      - name: Enforce Simulation-Only Guard
        run: |
          echo "LIVE BROKER = DISABLED"
          echo "MODE = ${{ github.event.inputs.run_mode || 'dry_run' }}"
          if [ "${{ github.event.inputs.confirm_simulation }}" = "false" ]; then
            echo "Refusing non-simulation confirmation"
            exit 1
          fi

      # ------------------------------------------------------------------------
      # 6. COMPILE CHECK
      # ------------------------------------------------------------------------
      - name: Compile All Python Modules
        run: python -m compileall -q .

      # ------------------------------------------------------------------------
      # 7. MODE ROUTING
      # ------------------------------------------------------------------------
      - name: Run IDX Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          MODE="${{ github.event.inputs.run_mode || 'dry_run' }}"
          mkdir -p logs reports .cache

          case "$MODE" in
            health_check)
              python main.py --health-check || python -c "from main import ProductionOrchestrator; ProductionOrchestrator(dry_run=True).run_health_check()"
              ;;
            self_learning)
              python main.py --dry-run --self-learning || python main.py --dry-run
              ;;
            release_audit)
              python -m compileall -q .
              python -c "import main, portfolio, signal_idx, features, machine_learning; print('IMPORT_OK')"
              ;;
            reset)
              rm -f portfolio_state.json portfolio_*.json checkpoint*.json || true
              echo "State reset complete"
              ;;
            *)
              python main.py --dry-run
              ;;
          esac

      # ------------------------------------------------------------------------
      # 8. SAVE RUNTIME STATE (optional, non-code)
      # ------------------------------------------------------------------------
      - name: Commit Simulation State
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          # Stage ONLY runtime state.
          git add -f universe.json 2>/dev/null || true
          git add portfolio_*.json 2>/dev/null || true
          git add checkpoint*.json 2>/dev/null || true
          git add reports/*.md 2>/dev/null || true
          git add reports/*.csv 2>/dev/null || true
          git add storage/*.json 2>/dev/null || true
          git add prediksi_idx_log.csv 2>/dev/null || true

          # Do NOT automatically commit arbitrary source/model/database files.
          # This prevents runtime jobs from accidentally modifying production code.

          if git diff --cached --quiet; then
            echo "✔ No runtime state changes."
            exit 0
          fi

          git commit \
            -m "chrono(bot): update simulation state [skip ci]"

          git push origin HEAD:main

          echo "✔ Simulation state pushed to main."

      # ------------------------------------------------------------------------
      # 9. FAILURE TELEMETRY
      # ------------------------------------------------------------------------
      - name: Upload Failure Telemetry
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: idx-pipeline-failure-${{ github.run_id }}
          retention-days: 14
          path: |
            logs/
            reports/
            prediksi_idx_log.csv
